apply plugin: 'com.android.application'
def cfg=new groovy.json.JsonSlurper().parse(rootProject.file('../../android-project.json'))
android {
 namespace cfg.appId
 compileSdk rootProject.ext.compileSdkVersion
 buildFeatures { buildConfig true }
 defaultConfig { manifestPlaceholders=[hostAppLabel:'@string/app_name'];applicationId cfg.appId; minSdkVersion rootProject.ext.minSdkVersion; targetSdkVersion rootProject.ext.targetSdkVersion; versionCode cfg.versionCode; versionName cfg.versionName; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 signingConfigs {
  production { def path=System.getenv('ANDROID_RELEASE_KEYSTORE');if(path)storeFile file(path);storePassword System.getenv('ANDROID_RELEASE_STORE_PASSWORD');keyAlias System.getenv('ANDROID_RELEASE_KEY_ALIAS');keyPassword System.getenv('ANDROID_RELEASE_KEY_PASSWORD') }
  preview { def path=System.getenv('ANDROID_PREVIEW_KEYSTORE');if(path)storeFile file(path);storePassword 'android';keyAlias 'androiddebugkey';keyPassword 'android' }
 }
 buildTypes {
  debug { manifestPlaceholders=[hostAppLabel:'@string/app_preview_name'];applicationIdSuffix '.playtest';if(System.getenv('ANDROID_PREVIEW_KEYSTORE'))signingConfig signingConfigs.preview }
  release { debuggable false;minifyEnabled true;shrinkResources true;signingConfig signingConfigs.production;proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' }
  releaseCheck { initWith release;manifestPlaceholders=[hostAppLabel:'@string/app_check_name'];applicationIdSuffix '.releasecheck';signingConfig System.getenv('ANDROID_PREVIEW_KEYSTORE')?signingConfigs.preview:signingConfigs.debug;matchingFallbacks=['release'] }
 }
}
repositories { flatDir { dirs '../capacitor-cordova-android-plugins/src/main/libs','libs' } }
dependencies {
 implementation project(':capacitor-android')
 implementation project(':capacitor-cordova-android-plugins')
 implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
 implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
 implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
 testImplementation "junit:junit:$junitVersion"
}
apply from: 'capacitor.build.gradle'
tasks.configureEach { task ->
 if(task.name in ['preReleaseBuild','preReleaseCheckBuild'])task.doFirst {
  def stamp=file('src/main/assets/public/native-build.json')
  if(!stamp.isFile()||new groovy.json.JsonSlurper().parse(stamp).channel!='release')throw new GradleException('Run npm run android:sync:release before optimized variants')
 }
 if(task.name=='preReleaseBuild')task.doFirst {project.exec {workingDir rootProject.file('../..');commandLine 'node','tools/release-config.mjs','--check'}}
}
